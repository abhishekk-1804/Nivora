
name: Nivora Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Test, Sign and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured"
            exit 1
          fi
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is empty or not configured"
            exit 1
          fi
          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS is empty or not configured"
            exit 1
          fi
          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD is empty or not configured"
            exit 1
          fi

          echo "Restoring Android release keystore..."
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 -d > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Decoded keystore file is empty"
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

          chmod 600 android/key.properties android/app/upload-keystore.jks
          echo "Signing configuration restored successfully."

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nivora-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nivora ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
